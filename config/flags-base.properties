# ============================================================
# 基础来源（低优先级）：所有开关的默认策略
# 规则文件格式见 README.md
# ============================================================

# 紧急总闸：true 时所有开关一律 OFF（可通过管理端热切换，无需改文件）
global.kill-switch=false

# 新结算页：10% 放量（基点制 0~10000）
flag.new-checkout.enabled=true
flag.new-checkout.percentage=1000

# 新搜索：默认关闭，仅白名单
flag.new-search.enabled=true
flag.new-search.percentage=0
flag.new-search.allowlist=u-1001,u-1002

# 区域定向活动：仅对 region=cn 且 tenant=beta 的请求开放
flag.regional-promo.enabled=true
flag.regional-promo.targeting.region=cn
flag.regional-promo.targeting.tenant=beta
