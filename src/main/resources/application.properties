spring.application.name=runtime-feature-flags-java

# ===== 运行时功能开关配置 =====
# 低优先级（必需）来源
feature-flags.base-file=config/flags-base.properties
# 高优先级（可选）来源：文件缺失只记录告警不阻断刷新
feature-flags.override-file=config/flags-override.properties
# 判定失败兜底：false=fail-closed（默认，兜底 OFF）；true=fail-open（兜底 ON，原因仍可区分）
feature-flags.fail-open=false
# 保留的历史快照数量（用于回滚）
feature-flags.history-size=10
